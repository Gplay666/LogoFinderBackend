{% if events %}
<table class="events-table">
    <thead>
        <tr>
            <th>Дата</th>
            <th>Время</th>
            <th>Канал</th>
            <th>Компания</th>
        </tr>
    </thead>
    <tbody>
        {% for event in events %}
        <tr>
            <td>{{ event.detected_at.strftime('%Y-%m-%d') }}</td>
            <td>{{ event.detected_at.strftime('%H:%M:%S') }}</td>
            <td>{{ event.channel }}</td>
            <td>{{ event.company }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<div class="no-events">Нет событий</div>
{% endif %}
