{% extends "base.html" %}

{% block title %}Мониторинг обнаружения логотипа{% endblock %}

{% block content %}
<header>
    <h1>Мониторинг обнаружения логотипа</h1>
</header>

<section class="events-section">
    <h2>Лента событий — всего записей: <span class="count-badge">{{ total_count }}</span></h2>
    <div id="events-list"
         hx-get="/events/?limit=50"
         hx-trigger="load, every 1s"
         hx-swap="innerHTML"
         hx-indicator="#events-loader">
    </div>
    <div id="events-loader" class="htmx-indicator">Загрузка...</div>
</section>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
{% endblock %}
